<!DOCTYPE html>
<html lang="en">
<head>

<body class="shop">
<div id="app-header"></div>
<div class="container page"><h1>Products</h1>
<div class="filters"><input id="fQ" type="search" placeholder="Search by product name or ID" aria-label="Search"><select id="fCat" aria-label="Category"><option value="">All categories</option></select>
<select id="fSort" aria-label="Sort"><option value="new">Newest first</option><option value="plow">Price: low to high</option><option value="phigh">Price: high to low</option><option value="name">Name A-Z</option></select></div>
<p id="resultInfo" class="muted"></p><div id="grid" class="cards"><div class="loading">Loading...</div></div><div id="pager" class="pager"></div></div>
<div id="app-footer"></div>
