<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin" data-page="inventory" >
<div class="admin-shell"><aside id="sidebar"></aside><div class="admin-main"><header id="topbar"></header><main class="admin-content">
<h1>Inventory Management</h1><div class="toolbar"><div><label for="fCat">Category</label><select id="fCat"></select></div><div><label for="fType">Search by</label><select id="fType"><option value="all">Name or ID</option><option value="name">Name</option><option value="id">Product ID</option></select></div><div class="grow"><label for="fQ">Search</label><input id="fQ" type="search" placeholder="Type to search"></div><button class="btn btn-ghost" id="seedAccessories" type="button">Import Accessories (12)</button><button class="btn" id="addProd" type="button">Add product</button></div><div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Image</th><th>Title</th><th>Category</th><th class="num">Quantity</th><th class="num">Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="invRows"></tbody></table></div><div id="pager" class="pager"></div><div class="modal" id="prodModal"><div class="modal-box wide"><h2><span id="prodTitle">Add product</span></h2><form id="prodForm" novalidate><div class="form-grid"><div class="field"><label for="pId">Product ID</label><input id="pId" type="text" maxlength="30"><span class="field-error" data-for="id"></span></div><div class="field"><label for="pCat">Category</label><select id="pCat"></select><span class="field-error" data-for="catId"></span></div><div class="full"><div class="field"><label for="pTitle">Title</label><input id="pTitle" type="text" maxlength="120"><span class="field-error" data-for="title"></span></div></div><div class="field full"><label for="pDesc">Description</label><textarea id="pDesc" rows="3" maxlength="1000"></textarea><span class="field-error" data-for="description"></span></div><div class="field"><label for="pQty">Quantity (0 = out of stock)</label><input id="pQty" type="number" min="0" step="1"><span class="field-error" data-for="quantity"></span></div><div class="field"><label for="pPrice">Price in rupees (whole number)</label><input id="pPrice" type="number" min="1" step="1"><span class="field-error" data-for="price"></span></div><div class="full"><div class="field"><label for="pUrl">Image URL (optional)</label><input id="pUrl" type="url" placeholder="https://..."><span class="field-error" data-for="imageUrl"></span></div></div><div class="field"><label for="pFile">...or upload an image to Cloudinary (optional, max 2 MB)</label><input id="pFile" type="file" accept="image/*"><span class="field-error" data-for="imageFile"></span><span class="hint">Uploads to your configured unsigned Cloudinary preset; products use the returned image URL.</span></div><div class="field"><label>Preview</label><img id="pPrev" class="preview" alt=""></div><div class="field full"><label><input id="pFeat" type="checkbox"> Show in "Featured products" on the home page</label></div></div><div class="modal-actions"><button class="btn btn-ghost" data-close type="button">Cancel</button><button class="btn" id="saveProd" type="submit">Save product</button></div></form></div></div><div class="modal" id="viewModal"><div class="modal-box wide"><h2>Product details</h2><div id="viewBody"></div><div class="modal-actions"><button class="btn btn-ghost" data-close type="button">Close</button></div></div></div>
</main></div></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/api/firebase-config.js"></script>
  <script src="../js/common/session.js"></script>
  <script src="../js/api/auth-api.js"></script>
  <script src="../js/api/database-api.js"></script>
  <script src="../js/api/storage-api.js"></script>
  <script src="../js/api/cloudinary-api.js"></script>
  <script src="../js/common/utils.js"></script>
  <script src="../js/common/validation.js"></script>
  <script src="../js/common/guard.js"></script>
  <script src="../js/common/pagination.js"></script>
  <script src="../js/common/cookies.js"></script>
  <script src="../js/common/bill.js"></script>
  <script src="../js/common/demo-store.js"></script>
  <script src="../js/admin/admin-layout.js"></script>
  <script src="../js/admin/inventory.js"></script>
</body>
</html>
