<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Inventory</title><link rel="stylesheet" href="../css/common.css"></head><body>
<nav><b>Admin</b><a href="inventory.html">Inventory</a><a href="customers.html">Customers</a><button onclick="logout()">Logout</button></nav>
<main>
<div class="card"><h3>Categories <button id="seed" type="button">Load sample data</button></h3><div class="row"><input id="cname" placeholder="New category name"><button class="pri" id="cadd">Add</button></div><p id="clist"></p></div>
<div class="card"><h3 id="ft">Add Product</h3><form id="pf" class="row">
<input id="pid" placeholder="Product ID" required><select id="pcat" required></select><input id="ptitle" placeholder="Title" required>
<input id="pdes" placeholder="Description"><input id="pqty" type="number" min="0" placeholder="Qty"><input id="pprice" type="number" min="0.01" step="0.01" placeholder="Price">
<input id="pimg" placeholder="Image URL (optional)"><button class="pri">Save</button><button type="button" id="pcancel">Clear</button></form><p class="err-t" id="perr"></p></div>
<div class="card"><div class="row"><input id="sq" placeholder="Search name or ID"><select id="fc"><option value="">All categories</option></select>
<select id="ps"><option>5</option><option>10</option><option>20</option></select></div>
<div class="tw"><table><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Qty</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div><div class="pg" id="pg"></div></div>
</main>
<dialog id="dlg"><p>Are you sure you want to permanently delete this product?</p><div class="row"><button class="dan" id="yes">Yes</button><button id="no">No</button></div></dialog>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>var ROOT="../";</script><script src="../js/firebase-config.js"></script><script src="../js/common.js"></script><script src="../js/api.js"></script><script src="../js/inventory.js"></script></body></html>
